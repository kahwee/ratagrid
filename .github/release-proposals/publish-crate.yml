# PROPOSAL ONLY. Access approval is required before activation.
name: Publish crate
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: crate-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Validate manifest, lock and tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/test_check_release.py
          python3 scripts/check-release.py "$RELEASE_TAG"
      - name: Require exact-source CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source_sha="$(git rev-parse HEAD)"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$source_sha&per_page=100" > "$RUNNER_TEMP/ci.json"
          jq -e --arg sha "$source_sha" '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success" and (.event == "push" or .event == "pull_request"))] | length > 0' "$RUNNER_TEMP/ci.json"
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - name: Verify package
        run: |
          cargo package --locked --list
          cargo publish --locked --dry-run
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish the checked crate
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
