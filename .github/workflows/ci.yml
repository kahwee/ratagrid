name: CI
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Keep useful line information in CI without full debugger metadata.
      # Local Cargo profiles and release optimization remain unchanged.
      CARGO_PROFILE_DEV_DEBUG: "1"
      CARGO_PROFILE_TEST_DEBUG: "1"
      CARGO_INCREMENTAL: "0"
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.os }}
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-python@v7.0.0
        if: runner.os != 'Windows'
        with:
          python-version: '3.12'
      # Read-only source checks and isolated Python tests can overlap Clippy.
      # Keep target-writing Cargo commands ordered to avoid build-lock contention.
      - parallel:
          - run: cargo fmt --all --check
          - run: cargo clippy --all-targets --locked -- -D warnings
          - name: Test benchmark reporting
            if: runner.os == 'Linux'
            run: python3 scripts/test_benchmark_ci.py
          - name: Test Pages generation
            if: runner.os == 'Linux'
            run: python3 scripts/test_build_docs.py
          - name: Check bundled rustdoc guides
            if: runner.os == 'Linux'
            run: python3 scripts/build_rustdoc_guides.py --check
          - name: Check generated Pages files
            if: runner.os == 'Linux'
            run: python3 scripts/build_docs.py --check
      - run: cargo test --all-targets --locked
      - run: cargo test --doc --locked
      - name: Test terminal cleanup on errors and panics
        if: runner.os != 'Windows'
        run: python3 scripts/test_terminal_cleanup.py
      - name: Install terminal smoke dependency
        if: runner.os == 'Linux'
        run: python3 -m pip install pyte==0.8.2
      - name: Build release examples
        if: runner.os == 'Linux'
        run: cargo build --release --examples --locked
      # Smoke tests use built executables and write captures under target/playground;
      # rustdoc writes target/doc, so neither depends on the other.
      - parallel:
          - name: Run terminal smoke tests
            if: runner.os == 'Linux'
            run: python3 scripts/terminal_smoke.py
          - name: Build rustdoc
            run: cargo doc --no-deps --locked
