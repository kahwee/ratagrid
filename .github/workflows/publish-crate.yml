name: Publish crate
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: crate-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.event.sender.type == 'User'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'
      - name: Validate manifest, lock and tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/test_check_release.py
          python3 scripts/check-release.py "$RELEASE_TAG"
      - name: Require exact-source CI
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source_sha="$(git rev-parse HEAD)"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          test "$source_sha" = "$(git rev-parse "$GITHUB_SHA^{commit}")"
          git merge-base --is-ancestor "$source_sha" "origin/main"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$source_sha&per_page=100" > "$RUNNER_TEMP/ci.json"
          jq -e --arg sha "$source_sha" '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success" and .event == "push" and .head_branch == "main")] | length > 0' "$RUNNER_TEMP/ci.json"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - name: Verify package
        run: |
          python3 scripts/release_check.py package
      - name: Retain verified package only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-crate
          path: |
            target/package/*.crate
            target/package/tmp-registry/*.crate
            target/release-preflight.json
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      # A fresh runner, no checkout, no repository scripts and no builds with OIDC.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-crate
          path: ${{ runner.temp }}/verified-crate
      - name: Unpack the verified crate as data
        env:
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 -I - <<'PYTHON'
          import hashlib, json, os, pathlib, re, tarfile
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          artifact = root / 'verified-crate'
          evidence = json.loads((artifact / 'release-preflight.json').read_text())
          version = evidence['version']
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version)
          assert 'v' + version == os.environ['RELEASE_TAG']
          assert evidence['sha'] == os.environ['SOURCE_SHA']
          archives = list(artifact.rglob('*.crate'))
          assert len(archives) == 1, 'Expected exactly one verified crate'
          archive = archives[0]
          assert archive.stat().st_size <= 64 * 1024 * 1024
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == evidence['sha256']
          destination = root / 'crate-publish'
          destination.mkdir()
          with tarfile.open(archive) as package:
              seen, total = set(), 0
              for member in package.getmembers():
                  name = member.name.rstrip('/') if member.isdir() else member.name
                  parts = name.split('/')
                  assert all(part not in ('', '.', '..') for part in parts)
                  assert '\\' not in name and name not in seen
                  seen.add(name)
                  total += member.size
                  assert 0 <= member.size <= 64 * 1024 * 1024
                  assert len(seen) <= 10000 and total <= 128 * 1024 * 1024
                  assert parts and parts[0] == 'ratagrid-' + version
                  assert '..' not in parts and not member.name.startswith('/')
                  assert member.isfile() or member.isdir(), 'Links and devices forbidden'
              package.extractall(destination, filter='data')
          # Cargo runs from this clean parent, so packaged .cargo configs and
          # toolchain overrides are never loaded. --no-verify prohibits builds.
          (destination / 'manifest-path').write_text(str(destination / ('ratagrid-' + version) / 'Cargo.toml'))
          PYTHON
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish without executing package code
        working-directory: ${{ runner.temp }}/crate-publish
        run: cargo +1.99.1 publish --locked --no-verify --registry crates-io --manifest-path "$(cat manifest-path)"
        env:
          CARGO_HOME: ${{ runner.temp }}/publish-cargo-home
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
